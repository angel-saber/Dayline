<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Google connection · Dayline</title>
    <link rel="stylesheet" href="./styles.css?v=4c96946d1cdc" />
    <script type="module" src="./js/features/google/popup.js?v=4c96946d1cdc"></script>
  </head>
  <body class="google-connection-page">
    <main class="settings-card">
      <div class="eyebrow">DAYLINE CONNECTIONS</div>
      <h1 id="google-title">Connect Google</h1>
      <p
        >Google permissions are separate from your Dayline sign-in. Your notes are not sent to
        Google.</p
      >
      <p id="google-status" role="status" aria-live="polite"></p>
      <div class="inline">
        <button id="google-continue" type="button" class="primary" disabled
          >Continue to Google</button
        >
        <button id="google-cancel" type="button" class="secondary">Cancel</button>
      </div>
      <p class="field-hint"
        >Selected files remain in Drive. Sharing their links does not change who can access them.
        Access tokens are kept only in this window until it closes.</p
      >
    </main>
  </body>
</html>
